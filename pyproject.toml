[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-adversarial-red-teamer"
version = "0.1.0"
description = "LangGraph-powered adversarial red teaming framework: generates OWASP LLM Top 10 attack mutations, evaluates guardrail resistance and produces deterministic evasion/block classification reports"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "cibi-dev", email = "cibi-dev@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "langgraph>=0.2.0,<2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "pytest-asyncio>=0.23,<2.0",
    "mypy>=1.10,<3.0",
]

[project.scripts]
red-teamer = "redteam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/redteam"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --strict-markers"
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/redteam"]
branch = true
omit = ["tests/*", "benchmarks/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests", "benchmarks", ".venv"]
skips = ["B101"]
